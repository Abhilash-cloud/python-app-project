name: python-app-project
on:
  push:
    branches:
      - main
    paths:
      - src/**
      - Dockerfile
      - .github/workflows/**

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Short Commit ID
        shell: bash
        run: echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"

      - name: Build Docker image locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: abhilash10/python-app-1:${{ env.COMMIT_ID }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'abhilash10/python-app-1:${{ env.COMMIT_ID }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push verified image to Docker Hub
        run: docker push abhilash10/python-app-1:${{ env.COMMIT_ID }}